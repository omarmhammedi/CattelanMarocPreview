name: Back up cattelan-client

on:
  push:
    branches: [fix/emdash-editor-readiness]
    paths:
      - .github/workflows/backup-cattelan-client.yml
      - .github/cattelan-backup-recipient.pem
      - scripts/backup-cattelan-client.mjs
  workflow_dispatch:
    inputs:
      include_database:
        description: Also export D1 (requires the repository token to have D1 read permission)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup-cattelan-client
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export privately and encrypt
        run: node scripts/backup-cattelan-client.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/cattelan-encrypted-backup
          BACKUP_INCLUDE_DATABASE: ${{ inputs.include_database == true && 'true' || 'false' }}
          BACKUP_LOG_ENVELOPE: 'true'
      - name: Store only the encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: cattelan-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cattelan-encrypted-backup/backup.cms
            ${{ runner.temp }}/cattelan-encrypted-backup/manifest.json
          if-no-files-found: error
          retention-days: 3
